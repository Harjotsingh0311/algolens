[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "algolens"
version = "0.1.0"
description = "A citation-first RAG tutor built around MIT 6.046J Lecture 6."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.10,<3.0",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "PyYAML>=6.0.2,<7.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<1.0",
    "types-pyyaml>=6.0.12.20260906",
    "yt-dlp>=2026.10.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/algolens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
